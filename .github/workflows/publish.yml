name: Publish templates
on:
  push:
    branches: [main]
    paths:
      - 'templates/**'
  workflow_dispatch: {}
permissions:
  contents: write
env:
  ORG: ${{ vars.PUBLISH_ORG || github.repository_owner }}
  BRANCH: ${{ vars.PUBLISH_BRANCH || 'main' }}
  HOST: ${{ vars.PUBLISH_HOST || 'github.com' }}
jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { src: fastapi,     dst: template-fastapi     , key: DEPLOY_KEY_TEMPLATE_FASTAPI }
          - { src: flask,       dst: template-flask       , key: DEPLOY_KEY_TEMPLATE_FLASK }
          - { src: flask-nginx, dst: template-flask-nginx , key: DEPLOY_KEY_TEMPLATE_FLASK_NGINX }
          - { src: web,         dst: template-web         , key: DEPLOY_KEY_TEMPLATE_WEB }
          - { src: ds,          dst: template-ds          , key: DEPLOY_KEY_TEMPLATE_DS }
          - { src: lib,         dst: template-lib         , key: DEPLOY_KEY_TEMPLATE_LIB }
          - { src: base,        dst: template-base        , key: DEPLOY_KEY_TEMPLATE_BASE }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Start ssh-agent and load key for ${{ matrix.dst }}
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets[matrix.key] }}
      - name: Trust github host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${HOST}" >> ~/.ssh/known_hosts
      - name: Configure git identity
        run: |
          git config --global user.name "scaffold-kit bot"
          git config --global user.email "bot@users.noreply.github.com"
      - name: Publish ${{ matrix.src }} (templates/${{ matrix.src }} → ${{ env.ORG }}/${{ matrix.dst }})
        shell: bash
        run: |
          set -euo pipefail
          tmp="pub-${{ matrix.src }}"
          git subtree split --prefix="templates/${{ matrix.src }}" -b "$tmp"
          target="git@${{ env.HOST }}:${{ env.ORG }}/${{ matrix.dst }}.git"
          git push -f "$target" "$tmp:${{ env.BRANCH }}"
          git branch -D "$tmp"
